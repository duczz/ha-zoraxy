[mypy]
# Deliberately not pinned to the project's own 3.11 compatibility floor
# (see pyproject.toml's [tool.mypy]): this job type-checks against whatever
# Home Assistant version CI actually installs, and recent HA core itself
# uses newer-Python-only syntax internally (e.g. PEP 695 type statements),
# so mypy needs a matching --python-version to parse HA's own source.
python_version = 3.14
# Off, unlike pyproject.toml's [tool.mypy]: config_flow.py's
# `# type: ignore[call-arg]` on ConfigFlow's `domain=` kwarg is only needed
# for the lightweight lint job, which runs without the real homeassistant
# package installed and therefore can't see __init_subclass__'s signature.
# With real HA installed (this job), that ignore is genuinely unused —
# flagging it here would fight the other job's requirement instead of
# catching a real problem.
warn_unused_ignores = False
warn_redundant_casts = True
check_untyped_defs = True
no_implicit_optional = True
